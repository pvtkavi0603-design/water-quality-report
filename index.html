<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quality Analysis Report</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0b1220;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    .card {
      max-width: 1300px;
      width: 100%;
      text-align: center;
    }
    h1 {
      color: white;
      font-size: clamp(22px, 4vw, 42px);
      margin: 0 0 18px;
    }
    img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0,0,0,.4);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Water Quality Analysis Report</h1>
    <img src="water-quality-report.jpeg" alt="Water Quality Analysis Report">
  </div>
</body>
</html>
